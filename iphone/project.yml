name: KasaFace
options:
  bundleIdPrefix: com.kasa.studio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: L366799VND
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 4
targets:
  KasaFace:
    type: application
    platform: iOS
    sources:
      - KasaFace
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kasa Face
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 얼굴의 고개 방향과 표정을 추적해 선택한 맥의 방송 아바타에 전달합니다.
        NSLocalNetworkUsageDescription: 같은 네트워크에 있는 Kasa Studio에 얼굴 표정값을 보냅니다.
        NSBonjourServices: [_kasaface._udp]
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.kasa.studio.face.connect
            CFBundleURLSchemes: [kasaface]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kasa.studio.face
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
  KasaFaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: KasaFace
schemes:
  KasaFace:
    build:
      targets:
        KasaFace: all
    test:
      targets: [KasaFaceTests]
